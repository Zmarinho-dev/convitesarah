<!DOCTYPE html>
<html lang="pt-BR">
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">

<title>Sarah 18 Anos</title>

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
}

html{
scroll-behavior:smooth;
}

body{
background:#0b2f5b;
font-family:Arial,sans-serif;
overflow-x:hidden;
}

.hero{
position:fixed;
inset:0;
background:#08264b;
display:flex;
align-items:center;
justify-content:center;
z-index:9999;
}

.carta{
width:320px;
max-width:90%;
cursor:pointer;
transition:1.5s;
}

.carta img{
width:100%;
display:block;
border-radius:15px;
box-shadow:0 20px 60px rgba(0,0,0,.5);
}

.abrir{
transform:scale(1.15);
opacity:0;
}

.conteudo{
display:none;
}

.menu{
position:fixed;
top:15px;
left:50%;
transform:translateX(-50%);
z-index:999;
background:rgba(255,255,255,.15);
backdrop-filter:blur(10px);
padding:12px 20px;
border-radius:30px;
}

.menu a{
color:white;
text-decoration:none;
margin:0 10px;
font-weight:bold;
}

.secao{
min-height:100vh;
padding:80px 20px;
display:flex;
justify-content:center;
align-items:center;
flex-direction:column;
}

.card{
max-width:700px;
width:100%;
}

.card img{
width:100%;
display:block;
border-radius:20px;
box-shadow:0 20px 50px rgba(0,0,0,.35);
}

.botao{
display:inline-block;
background:white;
color:#0b2f5b;
padding:14px 30px;
border-radius:30px;
text-decoration:none;
font-weight:bold;
margin-top:25px;
}

.count{
display:flex;
gap:20px;
margin-top:25px;
color:white;
font-size:22px;
font-weight:bold;
}

.count div{
background:rgba(255,255,255,.12);
padding:15px;
border-radius:15px;
min-width:90px;
text-align:center;
}

.rsvp{
max-width:600px;
width:100%;
background:white;
padding:25px;
border-radius:20px;
}

.rsvp input{
width:100%;
padding:12px;
margin-bottom:12px;
border:1px solid #ddd;
border-radius:10px;
}

.rsvp button{
width:100%;
padding:15px;
background:#0b2f5b;
border:none;
color:white;
border-radius:10px;
font-size:18px;
cursor:pointer;
}

h2{
color:white;
margin-bottom:20px;
}

</style>

</head>
<body>

<div class="hero" id="hero">

<div class="carta" id="carta">
<img src="imagens/capa.jpg">
</div>

</div>

<div id="site" class="conteudo">

<nav class="menu">
<a href="#evento">Convite</a>
<a href="#avisos">Avisos</a>
<a href="#presentes">Presentes</a>
<a href="#confirmar">Confirmar</a>
</nav>

<section id="evento" class="secao">

<div class="card">
<img src="imagens/evento.jpg">
</div>

<a
target="_blank"
class="botao"
href="https://www.google.com/maps/search/?api=1&query=Estrada+do+Tindiba+3275">

📍 Como Chegar

</a>

<div class="count">

<div>
<span id="dias">0</span>
<br>Dias
</div>

<div>
<span id="horas">0</span>
<br>Horas
</div>

<div>
<span id="minutos">0</span>
<br>Min
</div>

</div>

</section>

<section id="avisos" class="secao">

<div class="card">
<img src="imagens/avisos.jpg">
</div>

</section>

<section id="presentes" class="secao">

<div class="card">
<img src="imagens/presentes.jpg">
</div>

</section>

<section id="confirmar" class="secao">

<h2>Confirme sua presença</h2>

<div class="rsvp">

<input
id="nome"
placeholder="Seu nome">

<input
id="acomp"
placeholder="Quantidade de acompanhantes">

<button onclick="confirmar()">

Confirmar Presença

</button>

</div>

</section>

<section class="secao">

<div class="card">
<img src="imagens/final.jpg">
</div>

</section>

</div>

<script>

document.getElementById("carta")
.onclick=function(){

this.classList.add("abrir");

setTimeout(()=>{

document.getElementById("hero").style.display="none";
document.getElementById("site").style.display="block";

},1200);

};

function confirmar(){

let nome =
document.getElementById("nome").value;

let acomp =
document.getElementById("acomp").value;

let texto =
`Olá Sarah!

Confirmo minha presença na festa.

Nome: ${nome}

Acompanhantes: ${acomp}`;

window.open(
`https://wa.me/5521981540275?text=${encodeURIComponent(texto)}`
);

}

const festa =
new Date("December 21, 2026 14:00");

function atualizar(){

const agora =
new Date();

const dif =
festa - agora;

const dias =
Math.floor(dif/1000/60/60/24);

const horas =
Math.floor(
(dif/1000/60/60)%24
);

const minutos =
Math.floor(
(dif/1000/60)%60
);

document.getElementById("dias").innerHTML=dias;
document.getElementById("horas").innerHTML=horas;
document.getElementById("minutos").innerHTML=minutos;

}

setInterval(atualizar,1000);

</script>

</body>
</html>
